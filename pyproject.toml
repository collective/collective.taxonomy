[project]
name = "collective.taxonomy"
dynamic = ["version", "readme"]
description = "Create, edit and use hierarchical taxonomies in Plone!"
license = "GPL-2.0-or-later"
license-files = ["LICENSE.md", "LICENSE.GPL"]
requires-python = ">=3.10"
authors = [
    { name = "Bo Simonsen", email = "bo@headnet.dk" },
    { name = "Malthe Borch", email = "mborch@gmail.com" },
]
keywords = [
    "Plone",
    "dexterity",
    "taxonomy",
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Framework :: Zope",
    "Framework :: Zope :: 5",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "collective.collectionfilter",
    "lxml",
    "plone.api",
    "plone.app.contentmenu",
    "plone.app.contenttypes",
    "plone.app.multilingual",
    "plone.app.registry",
    "plone.app.vocabularies",
    "plone.app.z3cform",
    "plone.autoform",
    "plone.base",
    "plone.behavior",
    "plone.dexterity",
    "plone.i18n",
    "plone.indexer",
    "plone.memoize",
    "plone.namedfile",
    "plone.protect",
    "plone.restapi",
    "plone.supermodel",
    "z3c.form",
    "Products.CMFCore",
    "Zope",
]

[project.optional-dependencies]
test = [
    "horse-with-no-namespace",
    "plone.app.dexterity",
    "plone.app.querystring",
    "plone.app.robotframework",
    "plone.app.testing",
    "plone.browserlayer",
    "plone.restapi[test]",
    "plone.schemaeditor",
    "plone.testing",
    "pytest",
    "pytest-cov",
    "pytest-plone>=1.0.0a2",
]
release = [
    "zest.releaser[recommended]",
    "zestreleaser.towncrier",
    "zest.pocompile",
]

[project.urls]
Changelog = "https://github.com/collective/collective.taxonomy/blob/master/CHANGELOG.md"
Homepage = "https://github.com/collective/collective.taxonomy"
PyPI = "https://pypi.org/project/collective.taxonomy"
Source = "https://github.com/collective/collective.taxonomy"
Tracker = "https://github.com/collective/collective.taxonomy/issues"


[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[tool.hatch.version]
path = "src/collective/taxonomy/__init__.py"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build]
strict-naming = true

[tool.hatch.build.targets.sdist]
# An explicit list: hatch reads the repository .gitignore but not a global
# one, so anything else in the checkout would end up in the sdist.
include = [
  "/*.md",
  "/LICENSE.GPL",
  "/docs",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/collective"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n---\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGELOG.md"

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/collective/collective.taxonomy/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Feature"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfix"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["collective.taxonomy", "tests"]
branch = true
parallel = true
omit = [
  "src/collective/taxonomy/locales/*.py",
]

[tool.zest-releaser]
python-file-with-version = "src/collective/taxonomy/__init__.py"
