name: "Changelog"
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - master

env:
  base-branch: master

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip changelog') }}
    uses: ./.github/workflows/config.yml

  checks:
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all history
          fetch-depth: '0'

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x
        with:
          python-version: ${{ needs.config.outputs.python-version }}
          working-directory: '.'

      - name: "Fetch base branch"
        run: |
          # Reference: https://github.com/actions/checkout/#fetch-all-branches.
          git fetch --no-tags origin ${{ env.base-branch }}

      - name: "Backend: Check"
        id: backend-changelog
        run: |
          uvx towncrier check --compare-with origin/${{ env.base-branch }} --config ${{ needs.config.outputs.path-root }}/pyproject.toml --dir ${{ needs.config.outputs.path-root }}

      - name: "Report check"
        if: ${{ always() }}
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| backend |${{ steps.backend-changelog.conclusion }} |' >> $GITHUB_STEP_SUMMARY
